<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-Zelda i Phaser 3 (8-bit)</title>
  <!-- Så webbläsaren inte ber om en saknad favicon.ico (det blir ett fel i konsolen) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23fc5800'/%3E%3Crect x='6' y='1' width='4' height='8' fill='%23fcfcfc'/%3E%3C/svg%3E" />
  <style>
    /* Svart bakgrund och inga marginaler – spelet fyller hela fönstret */
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    /* Skarpa pixlar när den lilla duken skalas upp (ingen suddighet) */
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 från CDN (jsDelivr). Ger oss den globala variabeln "Phaser". -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

  <!-- Vår egen kod laddas som ES-modul (kräver en lokal webbserver, inte file://) -->
  <!-- ?v= byter adress när spelet uppdateras, så webbläsaren inte visar en gammal sparad version -->
  <script type="module" src="src/main.js?v=7"></script>
</body>
</html>
