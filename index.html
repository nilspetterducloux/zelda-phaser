<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini-Zelda i Phaser 3 (8-bit)</title>
  <style>
    /* Svart bakgrund och inga marginaler – spelet fyller hela fönstret */
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    /* Skarpa pixlar när den lilla duken skalas upp (ingen suddighet) */
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Phaser 3 från CDN (jsDelivr). Ger oss den globala variabeln "Phaser". -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>

  <!-- Vår egen kod laddas som ES-modul (kräver en lokal webbserver, inte file://) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
